<!-- OpenChamber 标记：按官方 logo（docs/references/badges/openchamber-logo-light.svg）
     的几何简化而成——官方原图是 37 段带 fill-opacity 的等距网格面，站点用 CSS mask
     取 alpha 通道，半透明网格会 mask 成一团灰雾，26px 下糊成方块。
     这里只留骨架：顶部开口的环 + 左右两个侧面（中间留缝，露出腔体内角）。 -->
<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 顶部开口：外菱形挖去内菱形，得到一圈开口边框 -->
  <path fill-rule="evenodd" clip-rule="evenodd"
        d="M50 2 L91.568 26 L50 50 L8.432 26 Z M50 8.72 L79.93 26 L50 43.28 L20.07 26 Z"
        fill="#000"/>
  <!-- 左侧面 -->
  <path d="M47 48.27 L8.432 26 L8.432 74 L47 96.27 Z" fill="#000"/>
  <!-- 右侧面 -->
  <path d="M53 48.27 L91.568 26 L91.568 74 L53 96.27 Z" fill="#000"/>
</svg>
