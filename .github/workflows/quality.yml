name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-guards:
    name: Repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/audit-content-boundaries.mjs --output-dir reports/content-boundaries

  quality:
    name: ${{ matrix.mode }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode:
          - cloud
          - local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: code/package-lock.json
      - run: npm ci --prefix code
      - run: npm run check:${{ matrix.mode }} --prefix code
