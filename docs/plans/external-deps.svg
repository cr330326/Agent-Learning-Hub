  <g id="annotations" />
  <g id="legend">
    <text x="60" y="1180" class="body">
      <tspan x="60" dy="0">连接线表示工程依赖该类别；虚线卡片表示可选能力。关键 Java 依赖不适用，不添加虚构 Java 服务。</tspan>
    </text>
    <text x="60" y="1220" class="body">
      <tspan x="60" dy="0">Better Auth、SQLite 驱动和任务队列嵌入应用；无需 Redis、MySQL、PostgreSQL 或 Kafka。</tspan>
    </text>
    <text x="60" y="1275" class="small">
      <tspan x="60" dy="0">模型增强是否启用取决于运行配置；生产反向代理不代表本机已部署。来源：code/package.json、code/docker/、discovery 模块。</tspan>
    </text>
