<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">Agent Learning Hub · 外部依赖</title>
  <desc id="desc">三类外部依赖：蓝色关键运行库，紫色运行设施，橙色外部 API。本项目没有 Java 工程。模型可选，反向代理由生产部署方提供。</desc>
  <metadata id="diagram-profile">{"locale": "zh-CN", "readingDirection": "top-to-bottom", "intendedEmbeddedWidth": 1200, "source": ["code/package.json", "code/docker/Dockerfile", "code/modules/discovery/adapters.ts", "code/modules/discovery/processing.ts", "code/modules/discovery/curation.ts"], "visualProfile": "Existing blue/green/amber/purple category palette; serif headings, system CJK body; manual node geometry", "nodes": ["APP", "NEXT", "BA", "SQL", "ZOD", "CHEER", "PRET", "NODE", "DB", "PROXY", "CICD", "OAUTH", "GITHUB", "FEISHU", "PUBLIC", "MODEL"], "relationships": [{"id": "app-runtime-libraries", "source": "APP", "target": "layer-runtime-libraries", "kind": "runtime"}, {"id": "app-middleware", "source": "APP", "target": "layer-middleware", "kind": "runtime"}, {"id": "app-external-apis", "source": "APP", "target": "layer-external-apis", "kind": "runtime"}]}</metadata>
